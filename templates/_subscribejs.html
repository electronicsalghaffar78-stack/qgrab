<script>
/* QGrab usage-stat pings. (This partial carried the email
   subscribe form wiring + the 3rd-download subscribe popup
   until release 2026-11-16.27, when the owner ordered ALL
   visitor-facing subscribe UI removed — footer form, popup,
   everything. The subscribe backend stays in app.py, dormant:
   no subscribe UI exists to call it and no email has ever
   been sent. The filename is kept because five templates
   include this partial for qgStat.)
   qgStat is fire-and-forget by design: it must never slow or
   break the feature it counts. */
window.qgStat = function (name) {
  try {
    fetch('/api/event', {
      method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    }).catch(function () {});
  } catch (e) {}
};
</script>
