<script>
/* --- PWA "Install App" header button + install guide sheet ---
   Chrome/Android no longer shows an automatic install banner, so
   the site offers the install itself: the browser's
   beforeinstallprompt is captured (and its automatic mini-infobar
   suppressed); clicking the header button then fires the real
   install prompt. Chrome withholds that event from new / low-
   engagement visitors, though, and iOS never sends it at all —
   for those visitors the click opens the install guide bottom
   sheet (_installbtn.html) with numbered steps that end with the
   QGrab icon on the home screen. The sheet stays open until the
   visitor closes it (close button, backdrop tap or Escape): an
   earlier auto-vanishing hint pill disappeared before anyone
   could finish the steps. If beforeinstallprompt arrives later
   in the session, the button switches to the native prompt.
   The button hides itself when the app already runs standalone
   or once it gets installed. */
(function () {
  var btn = document.getElementById('installBtn');
  if (!btn) return;
  var backdrop = document.getElementById('installBackdrop');
  /* The backdrop markup ships inside the sticky site <header>
     (alongside the button), and the header's backdrop-filter makes
     it a containing block for fixed-position descendants — so
     .install-backdrop's position:fixed; inset:0 resolved against
     the ~58px header strip instead of the viewport and the sheet
     rendered clipped at the top of the screen, title and steps
     off-screen. Move the backdrop to the end of <body> at init so
     its fixed positioning always anchors to the viewport. */
  if (backdrop && document.body) document.body.appendChild(backdrop);
  var closeBtn = document.getElementById('installSheetClose');
  var stepsAndroid = document.getElementById('installStepsAndroid');
  var stepsIos = document.getElementById('installStepsIos');
  function isStandalone() {
    return (window.matchMedia &&
            window.matchMedia('(display-mode: standalone)').matches) ||
           window.navigator.standalone === true;
  }
  function closeSheet() {
    if (backdrop) backdrop.hidden = true;
  }
  if (isStandalone()) { btn.hidden = true; return; }
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
  });
  window.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    btn.hidden = true;
    closeSheet();
  });
  function isIOS() {
    return /iphone|ipad|ipod/i.test(window.navigator.userAgent) ||
      (window.navigator.platform === 'MacIntel' &&
       window.navigator.maxTouchPoints > 1);
  }
  function openSheet() {
    if (!backdrop) return;
    var ios = isIOS();
    if (stepsAndroid) stepsAndroid.hidden = ios;
    if (stepsIos) stepsIos.hidden = !ios;
    backdrop.hidden = false;
  }
  btn.addEventListener('click', function () {
    if (deferredPrompt) {
      var promptEvent = deferredPrompt;
      deferredPrompt = null;
      promptEvent.prompt();
      if (promptEvent.userChoice) {
        promptEvent.userChoice.then(function () {}, function () {});
      }
      return;
    }
    openSheet();
  });
  if (closeBtn) closeBtn.addEventListener('click', closeSheet);
  if (backdrop) {
    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop) closeSheet();
    });
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
  });
})();
</script>
