<button type="button" class="theme-toggle" onclick="qgrabToggleTheme()" aria-label="{{ t.theme_toggle }}" title="{{ t.theme_toggle }}"><svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
<div class="hmenu">
  <button type="button" class="hmenu-btn" id="hmenuBtn" aria-haspopup="true" aria-expanded="false" aria-label="{{ t.menu_label }}" title="{{ t.menu_label }}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
  <div class="hmenu-panel" id="hmenuPanel" role="menu" hidden>
    <a href="/" role="menuitem">{{ t.nav_home }}</a>
    <a href="/#how" role="menuitem">{{ t.nav_how }}</a>
    <a href="/#faq" role="menuitem">{{ t.nav_faq }}</a>
    <div class="hmenu-sec">{{ t.menu_language }}</div>
    <div class="hmenu-langs">
      {% for l in languages %}<a href="{{ lang_url(l.code) }}"{% if l.code == lang %} class="on" aria-current="true"{% endif %}>{{ l.name }}</a>
      {% endfor %}
    </div>
  </div>
</div>
<script>
/* three-dot header menu: click to open, outside click / Esc to close */
(function () {
  var btn = document.getElementById('hmenuBtn');
  var panel = document.getElementById('hmenuPanel');
  if (!btn || !panel) return;
  function close() {
    panel.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
  }
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = panel.hidden;
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  panel.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (!panel.hidden) close(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden) { close(); btn.focus(); }
  });
})();
</script>
