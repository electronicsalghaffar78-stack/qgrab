{# "Update App" button logic — the on-demand refresh for the
   installed PWA, included on every page that carries the
   footer (home, platform, tool pages). Its toast hides itself
   after a few seconds — the site's established .sp-toast
   behaviour. #}
<script>
/* --- "Update App" button (footer only — the owner's order
   2026-11-08.11 removed the header twin; the bottom copy is
   the one and only Update App button) ---
   The installed PWA's on-demand refresh, the owner's model: a
   user who presses Update gets today's version immediately; a
   user who never presses is never disturbed. The press fetches
   /api/version with cache:"no-store" (the endpoint itself is
   also served no-store) and compares it with the version this
   browser last recorded (localStorage "qgrab_app_version"):
   - equal  -> a toast says the app is already latest; no reload.
   - differ -> the service worker is asked to update, EVERY
     Cache Storage entry is deleted (the shell cache name is
     static — "qgrab-shell-v7" — so clearing is what guarantees
     the reload cannot be answered by the old shell), the new
     version is recorded, a one-shot sessionStorage flag is set,
     and the page reloads; on the way back in, the flag produces
     the "App updated" toast and is cleared.
   - fetch fails (offline) -> a toast explains, button restored.
   Feedback reuses the site's .sp-toast styling/mechanism: the
   SP section's own #spToast element when the page has one, a
   same-class element created on the fly when it does not
   (platform pages). No timers count anything down — the toast
   simply hides itself after a few seconds. */
(function () {
  var footBtn = document.getElementById('appUpdateBtn');

  var toastTimer = null;
  function toastEl() {
    var t = document.getElementById('spToast') ||
            document.getElementById('appToast');
    if (!t && document.body) {
      t = document.createElement('div');
      t.className = 'sp-toast';
      t.id = 'appToast';
      t.setAttribute('role', 'status');
      document.body.appendChild(t);
    }
    return t;
  }
  function showToast(msg) {
    var t = toastEl();
    if (!t) return;
    t.textContent = msg;
    t.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 4500);
  }

  /* Arriving back from an update reload: say so once. */
  try {
    if (window.sessionStorage &&
        window.sessionStorage.getItem('qgrab_just_updated') === '1') {
      window.sessionStorage.removeItem('qgrab_just_updated');
      showToast('App updated — you now have the latest version ✔');
    }
  } catch (e) { /* storage unavailable: nothing to announce */ }

  var buttons = [];
  if (footBtn) buttons.push(footBtn);
  if (!buttons.length) return;
  var busy = false;
  function setBusy(on) {
    busy = on;
    buttons.forEach(function (b) {
      b.disabled = on;
      var span = b.querySelector ? b.querySelector('span') : null;
      var label = span || b;
      if (on) {
        if (!b.dataset.label) b.dataset.label = label.textContent;
        label.textContent = 'Checking…';
      } else if (b.dataset.label) {
        label.textContent = b.dataset.label;
      }
    });
  }
  async function doUpdate() {
    if (busy) return;
    setBusy(true);
    try {
      var resp = await fetch('/api/version', { cache: 'no-store' });
      if (!resp || !resp.ok) throw new Error('bad response');
      var data = await resp.json();
      var version = data && data.version;
      if (!version) throw new Error('no version');
      var current = null;
      try { current = window.localStorage.getItem('qgrab_app_version'); }
      catch (e) { /* treated as unset: the update path runs */ }
      if (current === version) {
        showToast('You already have the latest version.');
        setBusy(false);
        return;
      }
      try {
        if ('serviceWorker' in window.navigator &&
            window.navigator.serviceWorker.getRegistration) {
          var reg = await window.navigator.serviceWorker.getRegistration();
          if (reg && reg.update) await reg.update();
        }
      } catch (e) { /* a failed SW poke never blocks the refresh */ }
      try {
        if (typeof caches !== 'undefined' && caches.keys) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      } catch (e) { /* same: clearing is best-effort, reload decides */ }
      try {
        window.localStorage.setItem('qgrab_app_version', version);
        window.sessionStorage.setItem('qgrab_just_updated', '1');
      } catch (e) { /* the reload still brings the fresh shell */ }
      window.location.reload();
    } catch (e) {
      showToast("Couldn't check for updates — please check your connection and try again.");
      setBusy(false);
    }
  }
  buttons.forEach(function (b) { b.addEventListener('click', doUpdate); });
})();
</script>
<script>
/* --- App update gate — qgrab-migration-40 (build 2026-11-19.40) ---
   Internal note (never shown to visitors): this build's update
   destination is https://qgrab-lrin.onrender.com; the account
   behind the OLD address (qgrab.onrender.com) was closed by Google,
   so the old site can never receive another update the normal way.
   This block is INERT on every host except the old address. There
   it presents a plain app update, exactly as the owner ordered on
   2026-11-19 — the visible wording says only "QGrab Update / new
   version", never anything about addresses changing:
   - shows a slim banner at the very top announcing the update, with
     an "Update Now" button that opens the same page at the update
     destination;
   - the FIRST time a visitor tries to download anything in a
     session (a video, a photo, the extension — any download at all),
     it stops the download and shows the update popup FIRST. The big
     button takes the visitor to the update destination; a small
     "Later" button lets that one download proceed on the old site.
   Navigation links (platform pages, Download History) are NOT
   downloads and are never intercepted. */
(function () {
  if (window.location.hostname !== 'qgrab.onrender.com') return;
  var NEW_BASE = 'https://qgrab-lrin.onrender.com';
  var pendingEl = null;
  var bypass = false;

  function newUrl() {
    return NEW_BASE + window.location.pathname + window.location.search;
  }
  function continued() {
    try {
      return window.sessionStorage.getItem('qgrab_mig_continue') === '1';
    } catch (e) { return false; }
  }

  var css = document.createElement('style');
  css.textContent =
    '#qgrabMigBanner{position:relative;z-index:70;display:flex;gap:10px;' +
    'align-items:center;justify-content:center;flex-wrap:wrap;' +
    'background:#0b5cad;color:#fff;padding:9px 14px;font-size:14px;' +
    'text-align:center}' +
    '#qgrabMigBanner b{font-weight:700}' +
    '#qgrabMigBanner a{background:#ffb300;color:#1a1a1a;font-weight:700;' +
    'padding:5px 14px;border-radius:999px;text-decoration:none;' +
    'white-space:nowrap}' +
    '#qgrabMigOverlay{position:fixed;inset:0;z-index:200;display:none;' +
    'align-items:center;justify-content:center;background:rgba(0,0,0,.6);' +
    'padding:18px}' +
    '#qgrabMigCard{background:#fff;color:#14202b;max-width:420px;width:100%;' +
    'border-radius:16px;padding:24px 22px;text-align:center;' +
    'box-shadow:0 18px 50px rgba(0,0,0,.35)}' +
    '#qgrabMigCard h2{margin:0 0 10px;font-size:21px}' +
    '#qgrabMigCard p{margin:0 0 18px;font-size:14.5px;line-height:1.55;' +
    'color:#3c4a57}' +
    '#qgrabMigGo{display:block;background:#0b5cad;color:#fff;font-weight:700;' +
    'font-size:16px;padding:13px 16px;border-radius:12px;' +
    'text-decoration:none;margin-bottom:12px}' +
    '#qgrabMigStay{background:none;border:none;color:#5a6b7a;font-size:13px;' +
    'text-decoration:underline;cursor:pointer;padding:4px}';
  document.head.appendChild(css);

  function buildUi() {
    if (!document.body) return;
    var banner = document.createElement('div');
    banner.id = 'qgrabMigBanner';
    banner.innerHTML = '<span><b>QGrab Update:</b> a new version is ' +
      'available — voice search, new tools and more.</span>';
    var bLink = document.createElement('a');
    bLink.href = newUrl();
    bLink.textContent = 'Update Now';
    banner.appendChild(bLink);
    document.body.insertBefore(banner, document.body.firstChild);

    var overlay = document.createElement('div');
    overlay.id = 'qgrabMigOverlay';
    overlay.innerHTML =
      '<div id="qgrabMigCard" role="dialog" aria-modal="true">' +
      '<h2>QGrab Update</h2>' +
      '<p>A new version of QGrab is ready. This update brings voice ' +
      'search, new tools and a smoother experience. Tap Update Now ' +
      'to get the new version — it only takes a few seconds, and ' +
      'you can continue your download right after.</p>' +
      '<a id="qgrabMigGo" href="#">Update Now</a>' +
      '<button id="qgrabMigStay" type="button">Later</button></div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#qgrabMigGo').addEventListener('click',
      function (ev) {
        ev.preventDefault();
        window.location.href = newUrl();
      });
    overlay.querySelector('#qgrabMigStay').addEventListener('click',
      function () {
        try {
          window.sessionStorage.setItem('qgrab_mig_continue', '1');
        } catch (e) { /* the popup simply returns next session */ }
        overlay.style.display = 'none';
        if (pendingEl) {
          var el = pendingEl;
          pendingEl = null;
          bypass = true;
          try { el.click(); } catch (e) { /* nothing else to do */ }
          bypass = false;
        }
      });
  }
  if (document.body) buildUi();
  else document.addEventListener('DOMContentLoaded', buildUi);

  function isDownloadEl(el) {
    var href = (el.tagName === 'A' && el.getAttribute('href')) || '';
    if (el.hasAttribute('download')) return true;
    if (href.indexOf('/download?') === 0 ||
        href.indexOf('/api/download') === 0) return true;
    if (/\.(mp4|mp3|m4a|webm|zip)(\?|#|$)/i.test(href)) return true;
    if (el.tagName === 'BUTTON' &&
        /\bdownload\b/i.test(el.textContent || '')) return true;
    return false;
  }

  document.addEventListener('click', function (ev) {
    if (bypass || continued()) return;
    var t = ev.target;
    var el = (t && t.closest) ? t.closest('a,button') : null;
    if (!el) return;
    if (el.closest('#qgrabMigOverlay') ||
        el.closest('#qgrabMigBanner')) return;
    if (!isDownloadEl(el)) return;
    ev.preventDefault();
    ev.stopPropagation();
    pendingEl = el;
    var overlay = document.getElementById('qgrabMigOverlay');
    if (overlay) overlay.style.display = 'flex';
  }, true);
})();
</script>
