<script>
/* --- Video -> Script + AI Prompts tool (v2) ---
   OWNER'S HARD RULE: generation runs ONLY when the visitor presses
   one of this tool's own two buttons — "Create Script" or "Create
   Prompts" (Script and Prompts are separate jobs; each press sends
   its mode and fills only its own pane). Nothing fires on page
   load, on paste, or after /api/info. The download-result area's
   "Script + Prompts" button (window.qgrabSpPrefill) only scrolls
   here and pre-fills the link — it never starts a generation.
   While a generation runs, the pressed button shows the
   "Please wait" string plus a small countdown timer (owner's
   order: the time only, no extra words) with the spinner.
   All model output is rendered with textContent only — never
   innerHTML. */
(function(){
  const spForm = document.getElementById('spForm');
  if (!spForm || typeof I18N === 'undefined') return;
  const spUrl = document.getElementById('spUrl');
  const spBtnScript = document.getElementById('spBtnScript');
  const spBtnPrompts = document.getElementById('spBtnPrompts');
  const spRegen = document.getElementById('spRegenPrompts');
  const spSpin = document.getElementById('spSpinner');
  const spErr = document.getElementById('spError');
  const spRes = document.getElementById('spResult');
  const spScript = document.getElementById('spScript');
  const spPrompts = document.getElementById('spPrompts');
  const spButtons = [spBtnScript, spBtnPrompts, spRegen];
  const spLabels = {};
  spButtons.forEach(function(b){ spLabels[b.id] = b.textContent; });
  let spBusy = false;

  /* Cross-page prefill: a platform page's result button stores the
     link in sessionStorage before sending the visitor to the
     homepage section. Consume it once — fill the box only; the
     visitor still presses a button themselves. */
  try {
    const pre = sessionStorage.getItem('qgrab_sp_prefill');
    if (pre) {
      sessionStorage.removeItem('qgrab_sp_prefill');
      if (!spUrl.value) spUrl.value = pre;
    }
  } catch (e) {}

  function spShowError(msg){
    spErr.textContent = msg;
    spErr.style.display = 'block';
  }
  function spErrorText(code){
    if (code === 'no_subtitles') return I18N.sp_err_nosubs;
    if (code === 'too_long') return I18N.sp_err_toolong;
    if (code === 'audio_too_big') return I18N.sp_err_audiobig;
    if (code === 'no_speech') return I18N.sp_err_nospeech;
    if (code === 'rate_limited') return I18N.sp_err_rate;
    if (code === 'ai_unavailable') return I18N.sp_err_ai;
    if (code === 'not_configured') return I18N.sp_err_setup;
    if (code === 'invalid_url') return I18N.err_link;
    return I18N.err_generic;
  }
  /* Each mode fills ONLY its own pane; the other pane keeps
     whatever it already shows. The script pane is an editable
     textarea — the visitor can change the script right there,
     and the next Prompts run is then made from their edited
     text (it is sent along with the request). */
  function spRenderScript(data){
    spScript.value = data.script || '';
  }
  function spRenderPrompts(data){
    spPrompts.textContent = '';
    (data.prompts || []).forEach(function(p, i){
      const wrap = document.createElement('div');
      wrap.className = 'sp-prompt';
      const n = document.createElement('span');
      n.className = 'sp-prompt-n';
      n.textContent = String(i + 1);
      const pre = document.createElement('pre');
      pre.className = 'sp-out';
      pre.textContent = p;
      wrap.append(n, pre);
      spPrompts.appendChild(wrap);
    });
  }
  function spFmtTime(s){
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  /* --- Background jobs + polling (v3) ---
     Generation runs server-side as a job; this page only starts
     it and polls for the outcome, so a dropped connection, a
     sleeping phone or a reloaded tab no longer loses the result:
     the running job is kept in sessionStorage and polling resumes
     on page load. The countdown beside "Please wait" is PURELY
     COSMETIC — a holding aid only. It never gates the job: the
     result is rendered the instant a poll sees it (even with
     time left on the clock), and the clock reaching or passing
     zero never cancels, blocks or hides anything — it just
     switches to counting up. */
  const SP_JOB_KEY = 'sp_job';
  const SP_POLL_MS = 3000;
  const SP_MAX_WAIT_MS = 12 * 60 * 1000;

  function spStoreJob(job){
    try { sessionStorage.setItem(SP_JOB_KEY, JSON.stringify(job)); }
    catch (e) {}
  }
  function spClearStoredJob(){
    try { sessionStorage.removeItem(SP_JOB_KEY); } catch (e) {}
  }
  function spSleep(ms){
    return new Promise(function(res){ setTimeout(res, ms); });
  }
  /* Busy state + the cosmetic countdown. The estimate starts at
     a default (script 60s, prompts 150s) and sharpens when the
     parallel /api/info lookup reports the video's duration; that
     lookup never delays the generation itself. Returns a small
     controller: sharpen(duration) refines the estimate, stop()
     tears the busy state down and restores the button label. */
  function spStartWaitUI(btn, mode, t0){
    spBusy = true;
    spErr.style.display = 'none';
    spSpin.style.display = 'block';
    spButtons.forEach(function(b){ b.disabled = true; });
    let estimate = mode === 'prompts' ? 150 : 60;
    let alive = true;
    function tick(){
      const elapsed = (Date.now() - t0) / 1000;
      const remaining = estimate - elapsed;
      btn.textContent = I18N.sp_working + '… ' + spFmtTime(
        remaining > 0 ? Math.ceil(remaining) : Math.floor(elapsed));
    }
    tick();
    const timer = setInterval(tick, 1000);
    return {
      sharpen: function(duration){
        if (!alive || !(duration > 0)) return;
        const est = mode === 'prompts'
          ? Math.round(45 + 1.3 * duration)
          : Math.round(20 + 0.5 * duration);
        estimate = Math.min(300, Math.max(25, est));
        tick();
      },
      stop: function(){
        alive = false;
        clearInterval(timer);
        spSpin.style.display = 'none';
        spButtons.forEach(function(b){ b.disabled = false; });
        btn.textContent = spLabels[btn.id];
        spBusy = false;
      }
    };
  }
  function spSharpenFromInfo(url, ui){
    fetch('/api/info', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: url})
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d && d.duration > 0) ui.sharpen(d.duration);
    }).catch(function(){});
  }
  function spRenderResult(data, mode){
    if (mode === 'prompts') spRenderPrompts(data);
    else spRenderScript(data);
    spRes.style.display = 'block';
    spRes.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  }
  /* Poll until the job resolves. A poll that itself fails
     (network hiccup) is simply retried on the next tick — it is
     never treated as the job failing. A 404 means the server has
     forgotten the job (expired/restarted): that wait is over, so
     the generic AI-unavailable message is shown, the same one the
     12-minute client cap falls back to. */
  async function spPollJob(jobId, t0){
    const statusUrl = '/api/script-prompt/status?id=' +
      encodeURIComponent(jobId);
    for (;;) {
      if (Date.now() - t0 > SP_MAX_WAIT_MS) {
        throw new Error(spErrorText('ai_unavailable'));
      }
      let data = null;
      try {
        const r = await fetch(statusUrl);
        if (r.status === 404) {
          const gone = new Error(spErrorText('ai_unavailable'));
          gone.spJobGone = true;
          throw gone;
        }
        data = await r.json().catch(function(){ return null; });
      } catch (err) {
        if (err && err.spJobGone) throw err;
        data = null;  /* network-level failure: retry next tick */
      }
      if (data && data.status === 'done') return data;
      if (data && data.status === 'error') {
        throw new Error(spErrorText(data.error));
      }
      await spSleep(SP_POLL_MS);
    }
  }
  async function qgrabScriptPrompt(url, mode, btn){
    if (spBusy || !url) return;
    const t0 = Date.now();
    const ui = spStartWaitUI(btn, mode, t0);
    spSharpenFromInfo(url, ui);
    try {
      const body = {url: url, mode: mode};
      /* Forward flow: prompts are made from the script in the
         box whenever it has content (the visitor's edited text
         wins over re-reading the video). */
      if (mode === 'prompts' && spScript.value.trim()) {
        body.script = spScript.value;
      }
      const r = await fetch('/api/script-prompt', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      const data = await r.json().catch(function(){ return {}; });
      if (r.status === 202 && data.job_id) {
        spStoreJob({job_id: data.job_id, mode: mode, url: url,
                    started_at: t0});
        const finalData = await spPollJob(data.job_id, t0);
        spRenderResult(finalData, mode);
      } else if (!r.ok) {
        throw new Error(spErrorText(data.error));
      } else {
        /* A non-202 success should not happen; if it ever does,
           treat its payload as the finished result. */
        spRenderResult(data, mode);
      }
    } catch (err) {
      spShowError(err.message || I18N.err_generic);
    } finally {
      spClearStoredJob();
      ui.stop();
    }
  }
  /* Resume a job that was still running when this page went
     away (reload, connection drop, tab restore): if a stored job
     younger than the 12-minute cap exists, re-enter the busy UI
     and keep polling for the SAME job instead of losing it. */
  (function spResumeStoredJob(){
    let stored = null;
    try {
      stored = JSON.parse(
        sessionStorage.getItem(SP_JOB_KEY) || 'null');
    } catch (e) {}
    if (!stored || !stored.job_id ||
        typeof stored.started_at !== 'number') return;
    if (Date.now() - stored.started_at > SP_MAX_WAIT_MS) {
      spClearStoredJob();
      return;
    }
    const mode = stored.mode === 'prompts' ? 'prompts' : 'script';
    const btn = mode === 'prompts' ? spBtnPrompts : spBtnScript;
    if (stored.url && !spUrl.value) spUrl.value = stored.url;
    const ui = spStartWaitUI(btn, mode, stored.started_at);
    if (stored.url) spSharpenFromInfo(stored.url, ui);
    (async function(){
      try {
        const finalData = await spPollJob(
          stored.job_id, stored.started_at);
        spRenderResult(finalData, mode);
      } catch (err) {
        spShowError(err.message || I18N.err_generic);
      } finally {
        spClearStoredJob();
        ui.stop();
      }
    })();
  })();
  /* The ONLY generation triggers: the tool's own two buttons.
     (Pressing Enter in the link box runs the Script job.) */
  spBtnScript.addEventListener('click', function(){
    const url = spUrl.value.trim();
    if (url) qgrabScriptPrompt(url, 'script', spBtnScript);
  });
  spBtnPrompts.addEventListener('click', function(){
    const url = spUrl.value.trim();
    if (url) qgrabScriptPrompt(url, 'prompts', spBtnPrompts);
  });
  /* Regenerate: a fresh Prompts run for the same link (from the
     edited script when the box has content, like Create Prompts;
     it counts against the same daily limit — no special case). */
  spRegen.addEventListener('click', function(){
    const url = spUrl.value.trim();
    if (url) qgrabScriptPrompt(url, 'prompts', spRegen);
  });
  spForm.addEventListener('submit', function(e){
    e.preventDefault();
    const url = spUrl.value.trim();
    if (url) qgrabScriptPrompt(url, 'script', spBtnScript);
  });
  /* The download-result area's button: scroll + prefill ONLY.
     Generation still waits for the visitor to press a button. */
  window.qgrabSpPrefill = function(url){
    spUrl.value = url;
    const sec = document.getElementById('script-prompt');
    if (sec) sec.scrollIntoView({behavior: 'smooth'});
    spBtnScript.focus({preventScroll: true});
  };
  function spCopy(btn, text){
    const done = function(){
      const old = btn.textContent;
      btn.textContent = I18N.sp_copied;
      setTimeout(function(){ btn.textContent = old; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function(){});
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.remove();
    }
  }
  const copyScript = document.getElementById('spCopyScript');
  if (copyScript) copyScript.addEventListener('click', function(){
    spCopy(copyScript, spScript.value);
  });
  function spPromptsText(){
    const parts = [];
    spPrompts.querySelectorAll('.sp-out').forEach(function(el, i){
      parts.push((i + 1) + '. ' + el.textContent);
    });
    return parts.join('\n\n');
  }
  const copyPrompts = document.getElementById('spCopyPrompts');
  if (copyPrompts) copyPrompts.addEventListener('click', function(){
    spCopy(copyPrompts, spPromptsText());
  });
  /* Download (.txt): the pane's current content as a text file,
     made entirely in the browser. */
  function spDownload(filename, text){
    const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 100);
  }
  const dlScript = document.getElementById('spDlScript');
  if (dlScript) dlScript.addEventListener('click', function(){
    spDownload('qgrab-script.txt', spScript.value);
  });
  const dlPrompts = document.getElementById('spDlPrompts');
  if (dlPrompts) dlPrompts.addEventListener('click', function(){
    spDownload('qgrab-prompts.txt', spPromptsText());
  });
})();
</script>
